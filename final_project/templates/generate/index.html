<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body>
    <div class="main-layout">
        <form method="post" enctype="multipart/form-data" action="{% url 'generate' %}">
        {% csrf_token %}
            <div class="form-wrapper">
                <div class="left-column">
                    <div class="circle text-circle">
                        <label for="id_text">Text prompt</label>
                        {{ form.text }}
                        <span class="hint">{{ form.text.help_text }}</span>
                    </div>

                    <div class="circle file-circle">
                        <label for="id_image">Upload image</label>
                        {{ form.image }}
                        <span class="hint">{{ form.image.help_text }}</span>
                    </div>
                </div>

                <div class="center-column">
                    <div class="circle submit-circle">
                        <button type="submit" id="submit-btn">Submit</button>
                        <div class="spinner-border" style="display:none;"></div>
                    </div>
                </div>
            </div>
        </form>
        {% if task_id %}
            <script>
                const taskId = "{{ task_id }}";
            </script>
            <script src="{% static 'js/progress.js' %}"></script>
        {% endif %}
        
        <div id="video-container"></div>
            <svg id="graph-lines" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;   /* чтобы линии не мешали кликам */
        z-index: 0;
    "></svg>
    </div>

    <script src="{% static 'js/lines.js' %}"></script>
</body>
</html>
